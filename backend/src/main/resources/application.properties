# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ==========================================

# URL de conexão com o MySQL
# localhost:3308 = porta exposta pelo Docker
# /agenda = nome do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3308/agenda

spring.datasource.username=admin
spring.datasource.password=admin123

# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Atualiza automaticamente as tabelas conforme suas entidades
# Se a tabela não existir, ela será criada.
# Se você adicionar/modificar uma coluna, o Hibernate tenta atualizar.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os SQLs executados pelo Hibernate
spring.jpa.show-sql=true

# Formata os SQLs no console para ficarem mais legíveis
spring.jpa.properties.hibernate.format_sql=true


# Porta onde sua aplicação Spring Boot vai rodar
server.port=8080

jwt.secret=suaChaveSecretaMuitoLongaParaGarantirSeguranca
jwt.access-token-expiration=3600000

logging.level.org.springframework.security=DEBUG