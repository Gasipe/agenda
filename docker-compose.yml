services:
  app:
    build: ./backend
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy  # Só sobe quando o MySQL estiver saudável
    environment:
      # Opcional: passe as variáveis para o Spring via env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123

  mysql:
    image: mysql:oraclelinux9
    container_name: mysql-agenda
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenda
      MYSQL_USER: admin          # <-- Criei um usuário não-root
      MYSQL_PASSWORD: admin123   # <-- Senha do usuário
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:                 # <-- ESSENCIAL para o depends_on funcionar direito
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: